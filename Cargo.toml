[package]
name = "obsidian-to-logseq"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
chrono = "0.4.45"
clap = { version = "4.6.7", features = ["derive"] }
percent-encoding = "2.3.2"
serde = "1.0.229"
serde_json = "1.0.154"
sha2 = "0.11.0"
ureq = { version = "3.4.2", default-features = false }
uuid = { version = "1.28.0", features = ["v4"] }
walkdir = "2.5.0"
yaml_serde = "0.10.7"

[dev-dependencies]
tempfile = "3.27.0"
